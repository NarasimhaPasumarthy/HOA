<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOA Support</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385;
    --border: #e2e5eb; --accent: #2f6f5e; --accent-text: #ffffff;
    --user-bg: #2f6f5e; --user-text: #ffffff; --bot-bg: #ffffff; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e8ec; --muted: #9aa1b0;
      --border: #2b313c; --accent: #5fb39a; --accent-text: #0e1a16;
      --user-bg: #2f6f5e; --user-text: #ffffff; --bot-bg: #1f2430; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header .inner { max-width: 760px; margin: 0 auto; display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  #messages { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul, .msg.bot ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg.error { color: var(--error); }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .empty { text-align: center; color: var(--muted); margin-top: 8vh; }
  .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .suggestions button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 8px 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .suggestions button:hover { border-color: var(--accent); }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 160px; min-height: 44px; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
    font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send {
    height: 44px; padding: 0 18px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600;
  }
  button.send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><div class="inner"><h1>HOA Support</h1><span>Answers from your community's governing documents</span></div></header>
<main id="scroller">
  <div id="messages">
    <div class="empty" id="empty">
      <h2>Ask a question about your HOA</h2>
      <div>Rules, fees, parking, pets, architectural changes, and more.</div>
      <div class="suggestions">
        <button type="button">How many pets can I keep?</button>
        <button type="button">What are the quiet hours?</button>
        <button type="button">Can I park a commercial vehicle overnight?</button>
      </div>
    </div>
  </div>
</main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type your question…" aria-label="Question" required></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</footer>
<script>
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const messages = document.getElementById("messages");
  const scroller = document.getElementById("scroller");

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Minimal, safe markdown: escape first, then paragraphs, lists, **bold**, *italic*, `code`.
  function renderMarkdown(text) {
    const inline = s => s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
    const blocks = escapeHtml(text.trim()).split(/\n{2,}/);
    return blocks.map(block => {
      const lines = block.split("\n");
      if (lines.every(l => /^\s*[-*•]\s+/.test(l))) {
        return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>").join("") + "</ul>";
      }
      if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) {
        return "<ol>" + lines.map(l => "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
      }
      return "<p>" + inline(lines.join("<br>")) + "</p>";
    }).join("");
  }

  function addMessage(role, html) {
    document.getElementById("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.innerHTML = html;
    messages.appendChild(el);
    scroller.scrollTop = scroller.scrollHeight;
    return el;
  }

  async function ask(question) {
    addMessage("user", escapeHtml(question));
    const pending = addMessage("bot", '<span class="typing" aria-label="Thinking"><i></i><i></i><i></i></span>');
    send.disabled = true;
    try {
      const res = await fetch("api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      pending.innerHTML = renderMarkdown(data.answer || "No answer was returned.");
    } catch (err) {
      pending.classList.add("error");
      pending.textContent = err.message || "Something went wrong. Please try again.";
    } finally {
      send.disabled = false;
      scroller.scrollTop = scroller.scrollHeight;
      input.focus();
    }
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || send.disabled) return;
    input.value = "";
    autosize();
    ask(q);
  });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  document.querySelectorAll(".suggestions button").forEach(b =>
    b.addEventListener("click", () => ask(b.textContent)));
  input.focus();
</script>
</body>
</html>
